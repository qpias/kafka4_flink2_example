services:
  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      # KRaft settings (Kafka 4.0+ runs without Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Dual listeners: PLAINTEXT for internal Docker network, EXTERNAL for host access
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080" # Expose Kafka UI on host port 8080
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: 'local-kafka'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
      # KAFKA_CLUSTERS_0_ZOOKEEPERCONNECT: 'zookeeper:2181' # No longer needed

      # Flink JobManager - The coordinator of the Flink cluster
  flink-jobmanager:
    build:
      context: ./flink_image
    ports:
      - "8081:8081" # Flink Web UI
    command: jobmanager
    init: true # Add init process for better signal handling and permission propagation
    depends_on:
      - kafka
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.jvm-metaspace.size: 512m
    volumes:
      - "./app:/app"
      - "flink_jobmanager_data:/opt/flink/data"

  # Flink TaskManager - The worker(s) of the Flink cluster
  flink-taskmanager:
    build:
      context: ./flink_image
    command: taskmanager
    init: true # Add init process for better signal handling and permission propagation
    depends_on:
      - flink-jobmanager
      - kafka
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        # Increased to 4 slots to allow multiple Flink jobs to run concurrently
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.jvm-metaspace.size: 512m
    volumes:
      - "./app:/app"
      - "flink_taskmanager_data:/opt/flink/data"

# Volumes to persist data
volumes:
  kafka_data:
    driver: local
  flink_jobmanager_data:
    driver: local
  flink_taskmanager_data:
    driver: local
